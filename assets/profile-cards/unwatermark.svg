<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Unwatermark">
  <defs>
    <linearGradient id="uwTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7928CA"/>
      <stop offset="1" stop-color="#FF0080"/>
    </linearGradient>
    <pattern id="uwMark" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <text x="0" y="12" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="8px" fill="#7928CA" fill-opacity="0.75">MARK</text>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="219" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="12" y="10" width="376" height="3" rx="1.5" fill="url(#uwTop)"/>

  <text x="20" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#E6EDF3" text-anchor="start">Unwatermark</text>
  <text x="20" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11px" fill="#8B949E" text-anchor="start">
    <tspan x="20" dy="0">Browser-side tool that removes watermark grids</tspan>
    <tspan x="20" dy="15">from images and returns a clean export.</tspan>
  </text>

  <!-- before panel -->
  <g transform="translate(20,100)">
    <rect x="0" y="0" width="146" height="72" rx="8" fill="#0D1117" stroke="#30363D"/>
    <rect x="8" y="8" width="130" height="56" rx="5" fill="#1B1F27"/>
    <rect x="8" y="8" width="130" height="56" rx="5" fill="url(#uwMark)"/>
    <text x="73" y="-4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" fill="#8B949E" text-anchor="middle">before</text>
  </g>

  <!-- transform symbol -->
  <g transform="translate(200,136)">
    <circle cx="0" cy="0" r="18" fill="#0D1117" stroke="#7928CA" stroke-width="1.6"/>
    <path d="M-10 0 a 5 5 0 1 1 10 0 a 5 5 0 1 0 10 0 a 5 5 0 1 1 -10 0 a 5 5 0 1 0 -10 0"
          fill="none" stroke="#FF0080" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- after panel -->
  <g transform="translate(234,100)">
    <rect x="0" y="0" width="146" height="72" rx="8" fill="#0D1117" stroke="#FF0080" stroke-opacity="0.55"/>
    <rect x="8" y="8" width="130" height="56" rx="5" fill="#1B1F27"/>
    <circle cx="34" cy="30" r="8" fill="#7928CA" fill-opacity="0.8"/>
    <path d="M14 56 L44 30 L66 56 Z" fill="#FF0080" fill-opacity="0.45"/>
    <path d="M56 56 L84 34 L112 56 Z" fill="#7928CA" fill-opacity="0.6"/>
    <text x="73" y="-4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" fill="#FF0080" text-anchor="middle">after</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">
    <rect x="20" y="188" width="80" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="60" y="202" fill="#FF0080">JavaScript</text>
    <rect x="108" y="188" width="62" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="139" y="202" fill="#8B949E">Canvas</text>
    <rect x="178" y="188" width="78" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="217" y="202" fill="#8B949E">HTML / CSS</text>
  </g>
  <!-- logo -->
  <rect x="342" y="24" width="40" height="40" rx="9" fill="#0D1117" stroke="#FF0080" stroke-opacity="0.5"/>
  <image href="data:image/png;base64," x="349" y="31" width="26" height="26" preserveAspectRatio="xMidYMid meet"/>
</svg>
