<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="iHatePDF">
  <defs>
    <linearGradient id="pdfTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#FF8A65"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="219" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="12" y="10" width="376" height="3" rx="1.5" fill="url(#pdfTop)"/>

  <text x="20" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#E6EDF3" text-anchor="start">iHatePDF</text>
  <text x="20" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11px" fill="#8B949E" text-anchor="start">
    <tspan x="20" dy="0">Merge, split, compress and convert PDF files</tspan>
    <tspan x="20" dy="15">locally &#8212; no uploads, no sign-up, no limits.</tspan>
  </text>

  <!-- page A -->
  <g transform="translate(26,98)">
    <path d="M0 6 a 6 6 0 0 1 6 -6 h 34 l 16 16 v 52 a 6 6 0 0 1 -6 6 H 6 a 6 6 0 0 1 -6 -6 Z" fill="#0D1117" stroke="#30363D"/>
    <path d="M40 0 l 16 16 h -16 Z" fill="#FF4D4D" fill-opacity="0.55"/>
    <rect x="9" y="26" width="38" height="4" rx="2" fill="#21262D"/>
    <rect x="9" y="36" width="30" height="4" rx="2" fill="#21262D"/>
    <rect x="9" y="46" width="34" height="4" rx="2" fill="#21262D"/>
    <text x="28" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" font-weight="bold" fill="#FF4D4D" text-anchor="middle">PDF</text>
  </g>

  <!-- split / merge arrows -->
  <g fill="none" stroke="#FF4D4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 122 h 22 q 10 0 10 -10 v -4"/>
    <path d="M122 112 l 6 -8 l 6 8"/>
    <path d="M96 152 h 22 q 10 0 10 10 v 4"/>
    <path d="M122 162 l 6 8 l 6 -8"/>
  </g>
  <text x="118" y="141" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" fill="#FF8A65" text-anchor="middle">split</text>

  <!-- page B pair -->
  <g transform="translate(150,94)">
    <path d="M0 6 a 6 6 0 0 1 6 -6 h 30 l 14 14 v 24 a 6 6 0 0 1 -6 6 H 6 a 6 6 0 0 1 -6 -6 Z" fill="#0D1117" stroke="#FF4D4D" stroke-opacity="0.5"/>
    <rect x="9" y="22" width="30" height="4" rx="2" fill="#21262D"/>
    <rect x="9" y="31" width="22" height="4" rx="2" fill="#21262D"/>
  </g>
  <g transform="translate(150,134)">
    <path d="M0 6 a 6 6 0 0 1 6 -6 h 30 l 14 14 v 24 a 6 6 0 0 1 -6 6 H 6 a 6 6 0 0 1 -6 -6 Z" fill="#0D1117" stroke="#FF4D4D" stroke-opacity="0.5"/>
    <rect x="9" y="22" width="30" height="4" rx="2" fill="#21262D"/>
    <rect x="9" y="31" width="18" height="4" rx="2" fill="#21262D"/>
  </g>


  <!-- gear -->
  <g transform="translate(250,138)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#30363D" stroke-width="8"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FF4D4D" stroke-width="8" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="8" fill="#0D1117" stroke="#FF8A65" stroke-width="1.6"/>
  </g>

  <!-- tool chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">
    <rect x="288" y="100" width="82" height="20" rx="6" fill="#0D1117" stroke="#30363D"/>
    <text x="329" y="114" fill="#8B949E">Merge PDF</text>
    <rect x="288" y="126" width="82" height="20" rx="6" fill="#0D1117" stroke="#30363D"/>
    <text x="329" y="140" fill="#8B949E">Compress</text>
    <rect x="288" y="152" width="82" height="20" rx="6" fill="#0D1117" stroke="#FF4D4D" stroke-opacity="0.5"/>
    <text x="329" y="166" fill="#FF4D4D">PDF &#8594; DOCX</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">
    <rect x="20" y="188" width="80" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="60" y="202" fill="#FF4D4D">TypeScript</text>
    <rect x="108" y="188" width="62" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="139" y="202" fill="#8B949E">pdf-lib</text>
    <rect x="178" y="188" width="72" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="214" y="202" fill="#8B949E">Offline</text>
  </g>
</svg>
