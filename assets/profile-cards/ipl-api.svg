<svg xmlns="http://www.w3.org/2000/svg" width="265" height="200" viewBox="0 0 265 200" role="img" aria-label="IPL 2026 Free Cricket API">
  <defs>
    <linearGradient id="iplTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB800"/>
      <stop offset="1" stop-color="#1B3A6B"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="264" height="199" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="12" y="10" width="241" height="3" rx="1.5" fill="url(#iplTop)"/>

  <text x="16" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14px" font-weight="bold" fill="#E6EDF3">IPL 2026 Cricket API</text>
  <text x="16" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10px" fill="#8B949E">
    <tspan x="16" dy="0">Free JSON endpoints for live</tspan>
    <tspan x="16" dy="13">scores, squads and schedules.</tspan>
  </text>

  <!-- live badge -->
  <g transform="translate(178,26)">
    <rect x="0" y="0" width="70" height="20" rx="10" fill="#0D1117" stroke="#FFB800" stroke-opacity="0.6"/>
    <circle cx="14" cy="10" r="4" fill="#FFB800"/>
    <text x="44" y="14" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" fill="#FFB800" text-anchor="middle">LIVE</text>
  </g>

  <!-- json frame -->
  <g transform="translate(16,80)">
    <rect x="0" y="0" width="170" height="76" rx="6" fill="#0D1117" stroke="#30363D"/>
    <rect x="0" y="0" width="170" height="16" rx="6" fill="#131A26"/>
    <rect x="0" y="10" width="170" height="6" fill="#131A26"/>
    <text x="8" y="11.5" font-family="Consolas, Menlo, monospace" font-size="8px" fill="#8B949E">GET /v1/live</text>
    <g font-family="Consolas, Menlo, monospace" font-size="8px">
      <text x="8" y="30" fill="#8B949E">{</text>
      <text x="14" y="41" fill="#FFB800">"match"<tspan fill="#8B949E">: </tspan><tspan fill="#7EE787">"MI vs CSK"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text x="14" y="52" fill="#FFB800">"score"<tspan fill="#8B949E">: </tspan><tspan fill="#7EE787">"182/4 (18.2)"</tspan><tspan fill="#8B949E">,</tspan></text>
      <text x="14" y="63" fill="#FFB800">"status"<tspan fill="#8B949E">: </tspan><tspan fill="#7EE787">"in_play"</tspan></text>
      <text x="8" y="72" fill="#8B949E">}</text>
    </g>
  </g>

  <!-- cricket ball -->
  <g transform="translate(220,116)">
    <circle cx="0" cy="0" r="22" fill="#8B1A1A"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FFB800" stroke-width="1.4"/>
    <path d="M-8 -20 a 26 26 0 0 0 0 40" fill="none" stroke="#FFD98A" stroke-width="1.6"/>
    <path d="M-4 -21 a 26 26 0 0 0 0 42" fill="none" stroke="#FFD98A" stroke-width="1.6" stroke-dasharray="3 3"/>
    <ellipse cx="-7" cy="-8" rx="6" ry="4" fill="#FFFFFF" fill-opacity="0.14"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle">
    <rect x="16" y="166" width="54" height="18" rx="9" fill="#21262D" stroke="#30363D"/>
    <text x="43" y="179" fill="#FFB800">Node.js</text>
    <rect x="78" y="166" width="48" height="18" rx="9" fill="#21262D" stroke="#30363D"/>
    <text x="102" y="179" fill="#8B949E">REST</text>
    <rect x="134" y="166" width="58" height="18" rx="9" fill="#21262D" stroke="#30363D"/>
    <text x="163" y="179" fill="#8B949E">No key</text>
  </g>
</svg>
