<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="WhatsApp Chat Viewer">
  <defs>
    <linearGradient id="waTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#075E54"/>
      <stop offset="1" stop-color="#25D366"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="219" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="12" y="10" width="376" height="3" rx="1.5" fill="url(#waTop)"/>

  <text x="20" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#E6EDF3">WhatsApp Chat Viewer</text>
  <text x="20" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11px" fill="#8B949E">
    <tspan x="20" dy="0">Drop an exported chat and read it back as a real</tspan>
    <tspan x="20" dy="15">conversation &#8212; parsed entirely in your browser.</tspan>
  </text>

  <!-- chat window mock -->
  <g transform="translate(20,94)">
    <rect x="0" y="0" width="210" height="84" rx="8" fill="#0D1117" stroke="#30363D"/>
    <path d="M0 8 a 8 8 0 0 1 8 -8 h 194 a 8 8 0 0 1 8 8 v 12 H 0 Z" fill="#075E54"/>
    <circle cx="15" cy="10" r="6" fill="#25D366" fill-opacity="0.5"/>
    <rect x="27" y="6.5" width="58" height="7" rx="3.5" fill="#0B7268"/>
    <!-- incoming bubble -->
    <g>
      <path d="M10 28 h 92 a 5 5 0 0 1 5 5 v 12 a 5 5 0 0 1 -5 5 H 14 l -6 5 v -22 a 5 5 0 0 1 2 -5 Z" fill="#21262D"/>
      <rect x="16" y="34" width="66" height="4" rx="2" fill="#484F58"/>
      <rect x="16" y="42" width="48" height="4" rx="2" fill="#484F58"/>
    </g>
    <!-- outgoing bubble -->
    <g>
      <path d="M104 56 h 86 a 5 5 0 0 1 5 5 v 12 a 5 5 0 0 1 -5 5 H 104 a 5 5 0 0 1 -5 -5 V 61 a 5 5 0 0 1 5 -5 Z" fill="#075E54"/>
      <rect x="106" y="62" width="60" height="4" rx="2" fill="#25D366" fill-opacity="0.75"/>
      <rect x="106" y="70" width="42" height="4" rx="2" fill="#25D366" fill-opacity="0.5"/>
      <path d="M172 71 l 3 3 l 6 -7" fill="none" stroke="#25D366" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M178 71 l 3 3 l 6 -7" fill="none" stroke="#25D366" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- privacy shield -->
  <g transform="translate(246,96)">
    <path d="M22 0 L44 8 v 20 c 0 16 -12 28 -22 32 c -10 -4 -22 -16 -22 -32 V 8 Z" fill="#0D1117" stroke="#25D366" stroke-width="1.6"/>
    <path d="M13 30 L20 37 L32 22" fill="none" stroke="#25D366" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" fill="#8B949E" text-anchor="middle">100% local</text>
  </g>

  <!-- file inputs -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px">
    <rect x="304" y="96" width="66" height="24" rx="6" fill="#0D1117" stroke="#30363D"/>
    <path d="M314 102 h 8 l 4 4 v 10 h -12 Z" fill="none" stroke="#25D366" stroke-width="1.2"/>
    <text x="332" y="111" fill="#8B949E">_chat.txt</text>
    <rect x="304" y="126" width="66" height="24" rx="6" fill="#0D1117" stroke="#30363D"/>
    <path d="M314 132 h 12 v 10 h -12 Z" fill="none" stroke="#25D366" stroke-width="1.2"/>
    <path d="M319 132 v 10" stroke="#25D366" stroke-width="1.2"/>
    <text x="336" y="141" fill="#8B949E">export.zip</text>
    <rect x="304" y="156" width="66" height="22" rx="6" fill="#0D1117" stroke="#25D366" stroke-opacity="0.5"/>
    <text x="337" y="170" fill="#25D366" text-anchor="middle">media ok</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">
    <rect x="20" y="188" width="80" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="60" y="202" fill="#25D366">TypeScript</text>
    <rect x="108" y="188" width="62" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="139" y="202" fill="#8B949E">React</text>
    <rect x="178" y="188" width="78" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="217" y="202" fill="#8B949E">No upload</text>
  </g>
  <!-- logo -->
  <rect x="342" y="24" width="40" height="40" rx="9" fill="#0D1117" stroke="#25D366" stroke-opacity="0.5"/>
  <image href="data:image/png;base64," x="349" y="31" width="26" height="26" preserveAspectRatio="xMidYMid meet"/>
</svg>
