<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Stylish Readme">
  <defs>
    <linearGradient id="srTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF007A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="219" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="12" y="10" width="376" height="3" rx="1.5" fill="url(#srTop)"/>

  <text x="20" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#E6EDF3" text-anchor="start">Stylish-Readme</text>
  <text x="20" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11px" fill="#8B949E" text-anchor="start">
    <tspan x="20" dy="0">Copy-paste blocks for GitHub profiles: live widgets,</tspan>
    <tspan x="20" dy="15">badges, Spotify cards and animated headers.</tspan>
  </text>

  <!-- waveform -->
  <g transform="translate(22,96)">
    <rect x="0" y="0" width="150" height="82" rx="8" fill="#0D1117" stroke="#30363D"/>
    <g fill="#FF007A">
      <rect x="14" y="46" width="6" height="20" rx="3"/>
      <rect x="26" y="34" width="6" height="32" rx="3"/>
      <rect x="38" y="22" width="6" height="44" rx="3"/>
      <rect x="50" y="38" width="6" height="28" rx="3"/>
      <rect x="62" y="16" width="6" height="50" rx="3"/>
      <rect x="74" y="30" width="6" height="36" rx="3"/>
    </g>
    <g fill="#3B82F6">
      <rect x="86" y="42" width="6" height="24" rx="3"/>
      <rect x="98" y="26" width="6" height="40" rx="3"/>
      <rect x="110" y="36" width="6" height="30" rx="3"/>
      <rect x="122" y="48" width="6" height="18" rx="3"/>
    </g>
    <text x="75" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px" fill="#8B949E" text-anchor="middle">now playing widget</text>
  </g>

  <!-- lightning -->
  <g transform="translate(184,100)">
    <polygon points="18,0 2,38 14,38 6,74 32,30 18,30 28,0" fill="#FF007A"/>
    <polygon points="18,0 2,38 14,38 6,74 32,30 18,30 28,0" fill="none" stroke="#FF7AC0" stroke-width="1"/>
  </g>

  <!-- live profile widget -->
  <g transform="translate(232,96)">
    <rect x="0" y="0" width="138" height="82" rx="8" fill="#0D1117" stroke="#30363D"/>
    <circle cx="22" cy="24" r="12" fill="none" stroke="#FF007A" stroke-width="1.6"/>
    <circle cx="22" cy="20" r="4.5" fill="#FF007A"/>
    <path d="M14 31 a 8 8 0 0 1 16 0" fill="#FF007A"/>
    <rect x="42" y="14" width="72" height="7" rx="3.5" fill="#21262D"/>
    <rect x="42" y="26" width="52" height="7" rx="3.5" fill="#21262D"/>
    <rect x="12" y="48" width="114" height="6" rx="3" fill="#21262D"/>
    <rect x="12" y="48" width="76" height="6" rx="3" fill="#3B82F6"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px">
      <text x="12" y="70" fill="#FF007A" text-anchor="start">&#9733; 1.2k</text>
      <text x="62" y="70" fill="#8B949E" text-anchor="start">&#8593; 340 forks</text>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">
    <rect x="20" y="188" width="72" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="56" y="202" fill="#FF007A">Markdown</text>
    <rect x="100" y="188" width="52" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="126" y="202" fill="#8B949E">SVG</text>
    <rect x="160" y="188" width="84" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="202" y="202" fill="#8B949E">Profile Tools</text>
  </g>
</svg>
