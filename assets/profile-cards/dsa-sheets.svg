<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="DSA Sheets">
  <defs>
    <linearGradient id="dsaTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="219" rx="12" fill="#161B22" stroke="#30363D"/>
  <rect x="12" y="10" width="376" height="3" rx="1.5" fill="url(#dsaTop)"/>

  <text x="20" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#E6EDF3" text-anchor="start">DSA Sheets</text>
  <text x="20" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11px" fill="#8B949E" text-anchor="start">
    <tspan x="20" dy="0">Curated DSA practice sheets and roadmaps with</tspan>
    <tspan x="20" dy="15">topic-wise tracking from basics to advanced.</tspan>
  </text>

  <!-- tree -->
  <g transform="translate(24,92)">
    <g stroke="#A855F7" stroke-width="1.4" opacity="0.7">
      <line x1="88" y1="16" x2="46" y2="46"/>
      <line x1="88" y1="16" x2="130" y2="46"/>
      <line x1="46" y1="46" x2="22" y2="76"/>
      <line x1="46" y1="46" x2="68" y2="76"/>
      <line x1="130" y1="46" x2="152" y2="76"/>
    </g>
    <g font-family="Consolas, Menlo, monospace" font-size="9px" text-anchor="middle">
      <circle cx="88" cy="16" r="11" fill="#7C3AED"/>
      <text x="88" y="19.5" fill="#0D1117" font-weight="bold">1</text>
      <circle cx="46" cy="46" r="10" fill="#0D1117" stroke="#A855F7" stroke-width="1.6"/>
      <text x="46" y="49.5" fill="#A855F7">2</text>
      <circle cx="130" cy="46" r="10" fill="#0D1117" stroke="#A855F7" stroke-width="1.6"/>
      <text x="130" y="49.5" fill="#A855F7">3</text>
      <circle cx="22" cy="76" r="9" fill="#0D1117" stroke="#6E40C9" stroke-width="1.6"/>
      <text x="22" y="79.5" fill="#8B949E">4</text>
      <circle cx="68" cy="76" r="9" fill="#0D1117" stroke="#6E40C9" stroke-width="1.6"/>
      <text x="68" y="79.5" fill="#8B949E">5</text>
      <circle cx="152" cy="76" r="9" fill="#0D1117" stroke="#6E40C9" stroke-width="1.6"/>
      <text x="152" y="79.5" fill="#8B949E">6</text>
    </g>
  </g>

  <!-- array blocks -->
  <g transform="translate(206,96)" font-family="Consolas, Menlo, monospace" font-size="9px" text-anchor="middle">
    <rect x="0" y="0" width="24" height="24" fill="#0D1117" stroke="#30363D"/>
    <text x="12" y="16" fill="#A855F7">0</text>
    <rect x="24" y="0" width="24" height="24" fill="#0D1117" stroke="#30363D"/>
    <text x="36" y="16" fill="#8B949E">1</text>
    <rect x="48" y="0" width="24" height="24" fill="#0D1117" stroke="#30363D"/>
    <text x="60" y="16" fill="#8B949E">2</text>
    <rect x="72" y="0" width="24" height="24" fill="#0D1117" stroke="#30363D"/>
    <text x="84" y="16" fill="#8B949E">3</text>
    <rect x="96" y="0" width="24" height="24" fill="#0D1117" stroke="#A855F7"/>
    <text x="108" y="16" fill="#A855F7">4</text>
  </g>

  <!-- roadmap checklist -->
  <g transform="translate(206,132)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9px">
    <rect x="0" y="0" width="164" height="44" rx="6" fill="#0D1117" stroke="#30363D"/>
    <circle cx="14" cy="14" r="5" fill="#A855F7"/>
    <path d="M11.5 14 L13.5 16.5 L17 11.5" fill="none" stroke="#0D1117" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="17" fill="#8B949E" text-anchor="start">Arrays &#183; Strings &#183; Hashing</text>
    <circle cx="14" cy="32" r="5" fill="none" stroke="#484F58" stroke-width="1.4"/>
    <text x="26" y="35" fill="#8B949E" text-anchor="start">Trees &#183; Graphs &#183; DP</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle">
    <rect x="20" y="188" width="52" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="46" y="202" fill="#A855F7">C++</text>
    <rect x="80" y="188" width="70" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="115" y="202" fill="#8B949E">Roadmap</text>
    <rect x="158" y="188" width="72" height="20" rx="10" fill="#21262D" stroke="#30363D"/>
    <text x="194" y="202" fill="#8B949E">Practice</text>
  </g>
</svg>
